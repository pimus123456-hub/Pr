<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Illustrated stand-in for the hero photo: a ballpark under the lights at dusk.
       Swap for a real academy photo via the hero-image variable in styles.css. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081430"/>
      <stop offset=".45" stop-color="#16348A"/>
      <stop offset=".72" stop-color="#4E5FB0"/>
      <stop offset=".86" stop-color="#F2A65A"/>
      <stop offset="1" stop-color="#FFD58A"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7A3E"/>
      <stop offset="1" stop-color="#0F2E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#FFE29A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFE29A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFF1C4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mow" width="160" height="900" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <rect width="80" height="900" fill="#ffffff" opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant tree line and stands -->
  <path d="M0 560 C120 530 210 545 300 528 C420 505 520 540 640 522 C760 505 860 535 980 518 C1100 500 1220 530 1340 512 C1450 498 1530 520 1600 510 V610 H0Z" fill="#0E2430"/>
  <path d="M120 600 L120 548 L560 520 L560 600Z" fill="#1A2C52"/>
  <path d="M120 560 L560 532 M120 574 L560 548 M120 588 L560 563" stroke="#2C4478" stroke-width="3"/>
  <rect x="1020" y="560" width="520" height="40" fill="#13234A"/>
  <path d="M1040 560 h90 v40 h-90z M1150 560 h90 v40 h-90z M1260 560 h90 v40 h-90z M1370 560 h150 v40 h-150z" fill="#1E3570" opacity=".9"/>

  <!-- light towers -->
  <g stroke="#0A1530" stroke-width="7" fill="none">
    <path d="M300 600 L320 230 M340 600 L320 230"/>
    <path d="M1290 600 L1310 200 M1330 600 L1310 200"/>
  </g>
  <rect x="268" y="196" width="104" height="40" rx="6" fill="#0A1530"/>
  <rect x="1258" y="166" width="104" height="40" rx="6" fill="#0A1530"/>
  <g fill="#FFF4CF">
    <circle cx="286" cy="216" r="7"/><circle cx="310" cy="216" r="7"/><circle cx="334" cy="216" r="7"/><circle cx="356" cy="216" r="7"/>
    <circle cx="1276" cy="186" r="7"/><circle cx="1300" cy="186" r="7"/><circle cx="1324" cy="186" r="7"/><circle cx="1346" cy="186" r="7"/>
  </g>
  <circle cx="320" cy="216" r="210" fill="url(#glow)"/>
  <circle cx="1310" cy="186" r="230" fill="url(#glow)"/>
  <path d="M270 236 L60 900 H760 L372 236Z" fill="url(#beam)"/>
  <path d="M1258 206 L880 900 H1600 L1362 206Z" fill="url(#beam)"/>

  <!-- outfield + infield -->
  <path d="M0 600 Q800 560 1600 600 V900 H0Z" fill="url(#grass)"/>
  <path d="M0 600 Q800 560 1600 600 V900 H0Z" fill="url(#mow)"/>
  <path d="M0 612 Q800 572 1600 612" stroke="#B9814E" stroke-width="16" fill="none" opacity=".75"/>
  <path d="M800 960 L360 760 Q800 600 1240 760Z" fill="#B46F3F"/>
  <path d="M800 905 L560 790 L800 690 L1040 790Z" fill="#2E7A3D"/>
  <path d="M800 960 L250 712 M800 960 L1350 712" stroke="#F4EFE6" stroke-width="5" opacity=".85"/>
  <ellipse cx="800" cy="785" rx="34" ry="13" fill="#C27C48"/>
  <g fill="#F4EFE6"><rect x="553" y="783" width="16" height="10"/><rect x="792" y="683" width="16" height="10"/><rect x="1031" y="783" width="16" height="10"/></g>

  <!-- shade the bottom so copy sits on dark ground -->
  <rect y="560" width="1600" height="340" fill="#06101F" opacity=".35"/>
</svg>
